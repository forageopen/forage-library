<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>(function(){try{if(localStorage.getItem('forage-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[Article Title] — Forage Library</title>
  <link rel="stylesheet" href="../assets/css/forage.css" />
</head>
<body>

  <!-- ============ RIBBON — data-published must be yyyy-mm-dd, ribbon.js renders it as "Aug 5, 2026" ============ -->
  <header class="ribbon" data-published="yyyy-mm-dd">
    <span class="ribbon-title">[Article Title]</span>
    <div class="ribbon-actions">
      <span class="ribbon-meta">Published on <time class="ribbon-date"></time></span>

      <button class="ribbon-btn ribbon-share" type="button" aria-label="Share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
        <span>Share</span>
      </button>

      <button class="ribbon-btn ribbon-icon" type="button" data-action="copy-link" aria-label="Copy link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07L12.5 19.5"/></svg>
      </button>

      <button class="ribbon-btn ribbon-icon ribbon-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle dark mode">
        <svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-dark" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>

      <div class="ribbon-kebab-wrap">
        <button class="ribbon-btn ribbon-icon" type="button" data-action="toggle-menu" aria-haspopup="true" aria-expanded="false" aria-label="More options">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
        <ul class="ribbon-menu" role="menu" hidden>
          <li role="menuitem" data-action="copy-link">Copy link</li>
          <li role="menuitem" data-action="copy-content">Copy page content</li>
          <li role="menuitem" data-action="export">Export</li>
        </ul>
      </div>
    </div>
  </header>
  <!-- ============ END RIBBON ============ -->

  <main class="page-wrap" data-article-content>

    <!--
      Freeform template — no forced sections. Write however this piece
      needs. Each .page div below is one A4 sheet on screen and in print
      (page-break-after:always is already on .page in forage.css).
      Copy the whole .page block for a second page.

      Reusable classes from forage.css, all optional:
        .workflow / .card / .number / .role / .note / .arrow  — process diagrams
        .questions                                             — callout box
        .footer / .signature                                   — closing block
      Or just write plain h1 / h2 / h3 / p / ul / blockquote.

      Charts: inline SVG, or an <img> from assets/images/. For interactive
      charts, add a CDN script tag (e.g. Chart.js) in <head> — no repo
      changes needed.
    -->

    <div class="page">
      <h1>[Article Title]</h1>
      <div class="subtitle">[One-line subtitle.]</div>

      <div class="intro">
        <p>[Opening paragraph.]</p>
      </div>

    </div>

    <!--
    <div class="page">
      ... second page ...
    </div>
    -->

  </main>

  <script src="../assets/js/ribbon.js"></script>
</body>
</html>
