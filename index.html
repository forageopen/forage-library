<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>(function(){var VALID=['sakura','cherry','forest-brew','tea-mist','blueberry','kokoblu','dubai'];try{var t=localStorage.getItem('forage-theme');document.documentElement.setAttribute('data-theme',VALID.indexOf(t)!==-1?t:'cherry');}catch(e){document.documentElement.setAttribute('data-theme','cherry');}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forage Library</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="stylesheet" href="assets/css/forage.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.9/lib/marked.umd.js" integrity="sha384-kyb7rY2xnKgiRpRdAeNJxQ8e2SiGZy1m+FK9yME6M0eGJpg7EFaGGvf7+JSirgqE" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.12.1/mammoth.browser.min.js" integrity="sha384-HDD+X9TzmVU2HzA3VYqphTtip2QgcmmSAuKTMkFv709AUMZ6LPn0ysDRZeQIL31w" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.13/dist/purify.min.js" integrity="sha384-ZuC+DIACqSIZTsp+7YF57cR5Y+6qXa7YFbEKdA/EHA/R0T+41dtorqucYl71Zp+t" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js" integrity="sha384-4xaIisuLEy2lo2HkB2C4rEf7v8jbTb2kuogX6TkuEt9feTWKBSFSOzsqNNbV+sKh" crossorigin="anonymous"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
  <!-- pdf.js (pdfjs-dist@6.2.108) is loaded lazily via dynamic import in
       render-pdf.js, not here — it's ESM-only (no classic-script build)
       and large enough that most visits, which never open a PDF, shouldn't
       pay for it. -->
</head>
<body>

  <header class="ribbon" data-published="">
    <div class="ribbon-title-group">
      <button class="ribbon-btn ribbon-icon" type="button" data-action="toggle-sidebar" aria-expanded="true" aria-label="Toggle navigation" title="Toggle navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
      <span class="ribbon-title">Forage Library</span>
    </div>
    <div class="ribbon-actions">
      <div class="ribbon-theme-wrap">
        <button class="ribbon-btn ribbon-icon ribbon-theme-toggle" type="button" data-action="toggle-theme-menu" aria-haspopup="true" aria-expanded="false" aria-label="Theme" title="Change theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
        </button>
        <ul class="theme-popover" role="menu" hidden></ul>
      </div>
      <button class="ribbon-btn ribbon-icon" type="button" data-action="make-offline" aria-label="Make this site available offline" title="Make available offline"></button>
      <div class="ribbon-kebab-wrap">
        <button class="ribbon-btn ribbon-icon" type="button" data-action="toggle-menu" aria-haspopup="true" aria-expanded="false" aria-label="More options" title="More options">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
        <ul class="ribbon-menu" role="menu" hidden>
          <li role="menuitem" data-action="open-split">Open in split</li>
        </ul>
      </div>
    </div>
  </header>

  <div class="vault-layout">
    <nav class="vault-sidebar" data-vault-sidebar aria-label="Vault folders"></nav>
    <div class="vault-resize-handle" data-resize="sidebar" role="separator" aria-orientation="vertical" aria-label="Resize navigation" tabindex="0"></div>
    <main class="vault-panes" data-vault-panes>
      <section class="vault-pane">
        <div class="vault-pane-header" data-vault-pane-header hidden>
          <span class="vault-pane-header-name" data-vault-pane-name></span>
          <div class="vault-pane-header-actions">
            <button type="button" class="vault-pane-header-btn" data-action="pane-sidenote" aria-label="Sidenote" title="Take a note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </button>
            <div class="vault-pane-export-wrap">
              <button type="button" class="vault-pane-header-btn" data-action="pane-export-menu" aria-haspopup="true" aria-expanded="false" aria-label="Export" title="Export options">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
              </button>
              <ul class="vault-pane-export-menu" role="menu" hidden>
                <li role="menuitem" data-action="pane-export-html">Export as HTML</li>
                <li role="menuitem" data-action="pane-export-pdf">Export as PDF</li>
                <li role="menuitem" data-action="pane-export-markdown">Export as Markdown</li>
                <li role="menuitem" data-action="pane-export-docx">Export as Word (.docx)</li>
                <li role="menuitem" data-action="pane-export-json">Export as JSON</li>
                <li role="menuitem" data-action="pane-export-text">Export as Text</li>
                <li role="menuitem" data-action="pane-export-csv">Export as CSV</li>
                <li role="menuitem" data-action="pane-export-jpeg">Export as JPEG</li>
              </ul>
            </div>
            <button type="button" class="vault-pane-header-btn" data-action="pane-close" aria-label="Close file" title="Close file">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div class="vault-pane-stats-bar" data-vault-pane-stats-bar hidden>
          <span class="vault-pane-stats" data-vault-pane-stats></span>
        </div>
        <div class="vault-pane-body">
          <div class="vault-pane-main">
            <div class="vault-dropzone" data-vault-dropzone>
              <div class="vault-dropzone-message">
                <label class="vault-dropzone-label">
                  Choose files or drop files here
                  <input type="file" class="vault-dropzone-input" accept=".md,.txt,.docx,.pptx,.pdf,.xlsx,.csv" hidden>
                </label>
                <button type="button" class="vault-dropzone-new-note" data-action="new-note">or click to start a new note</button>
              </div>
            </div>
            <div class="vault-pane-content" data-vault-pane-content hidden></div>
          </div>
          <div class="vault-resize-handle vault-resize-handle--sidenote" data-resize="sidenote" role="separator" aria-orientation="vertical" aria-label="Resize sidenote" tabindex="0"></div>
          <aside class="vault-sidenote" data-vault-sidenote hidden>
            <h2>Sidenote</h2>
            <div class="vault-sidenote-toolbar" data-vault-sidenote-toolbar>
              <button type="button" class="vault-sidenote-btn" data-cmd="bold" aria-label="Bold" title="Bold"><b>B</b></button>
              <button type="button" class="vault-sidenote-btn" data-cmd="italic" aria-label="Italic" title="Italic"><i>I</i></button>
              <button type="button" class="vault-sidenote-btn" data-cmd="underline" aria-label="Underline" title="Underline"><u>U</u></button>
              <button type="button" class="vault-sidenote-btn" data-cmd="strikeThrough" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
              <span class="vault-sidenote-highlights" data-vault-sidenote-highlights></span>
            </div>
            <div class="vault-sidenote-input" data-vault-sidenote-input contenteditable="true" data-placeholder="Notes on this page…"></div>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <template data-vault-pane-template>
    <section class="vault-pane">
      <div class="vault-pane-header" data-vault-pane-header hidden>
        <span class="vault-pane-header-name" data-vault-pane-name></span>
        <div class="vault-pane-header-actions">
          <button type="button" class="vault-pane-header-btn" data-action="pane-sidenote" aria-label="Sidenote" title="Take a note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </button>
          <div class="vault-pane-export-wrap">
            <button type="button" class="vault-pane-header-btn" data-action="pane-export-menu" aria-haspopup="true" aria-expanded="false" aria-label="Export" title="Export options">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            </button>
            <ul class="vault-pane-export-menu" role="menu" hidden>
              <li role="menuitem" data-action="pane-export-html">Export as HTML</li>
              <li role="menuitem" data-action="pane-export-pdf">Export as PDF</li>
              <li role="menuitem" data-action="pane-export-markdown">Export as Markdown</li>
              <li role="menuitem" data-action="pane-export-docx">Export as Word (.docx)</li>
              <li role="menuitem" data-action="pane-export-json">Export as JSON</li>
              <li role="menuitem" data-action="pane-export-text">Export as Text</li>
              <li role="menuitem" data-action="pane-export-csv">Export as CSV</li>
              <li role="menuitem" data-action="pane-export-jpeg">Export as JPEG</li>
            </ul>
          </div>
          <button type="button" class="vault-pane-header-btn" data-action="pane-close" aria-label="Close file" title="Close file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="vault-pane-stats-bar" data-vault-pane-stats-bar hidden>
        <span class="vault-pane-stats" data-vault-pane-stats></span>
      </div>
      <div class="vault-pane-body">
        <div class="vault-pane-main">
          <div class="vault-dropzone" data-vault-dropzone>
            <div class="vault-dropzone-message">
              <label class="vault-dropzone-label">
                Choose files or drop files here
                <input type="file" class="vault-dropzone-input" accept=".md,.txt,.docx,.pptx,.pdf,.xlsx,.csv" hidden>
              </label>
              <button type="button" class="vault-dropzone-new-note" data-action="new-note">or click to start a new note</button>
            </div>
          </div>
          <div class="vault-pane-content" data-vault-pane-content hidden></div>
        </div>
        <div class="vault-resize-handle vault-resize-handle--sidenote" data-resize="sidenote" role="separator" aria-orientation="vertical" aria-label="Resize sidenote" tabindex="0"></div>
        <aside class="vault-sidenote" data-vault-sidenote hidden>
          <h2>Sidenote</h2>
          <div class="vault-sidenote-toolbar" data-vault-sidenote-toolbar>
            <button type="button" class="vault-sidenote-btn" data-cmd="bold" aria-label="Bold" title="Bold"><b>B</b></button>
            <button type="button" class="vault-sidenote-btn" data-cmd="italic" aria-label="Italic" title="Italic"><i>I</i></button>
            <button type="button" class="vault-sidenote-btn" data-cmd="underline" aria-label="Underline" title="Underline"><u>U</u></button>
            <button type="button" class="vault-sidenote-btn" data-cmd="strikeThrough" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
            <span class="vault-sidenote-highlights" data-vault-sidenote-highlights></span>
          </div>
          <div class="vault-sidenote-input" data-vault-sidenote-input contenteditable="true" data-placeholder="Notes on this page…"></div>
        </aside>
      </div>
    </section>
  </template>

  <script src="assets/js/ribbon.js"></script>
  <script src="assets/js/offline.js"></script>
  <script src="assets/js/visitor-counter.js"></script>
  <script type="module" src="assets/js/vault/app.js"></script>
</body>
</html>
