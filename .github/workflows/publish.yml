name: Publish Forage Library

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.pdf'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libpangocairo-1.0-0 \
            libcairo2 libxext6 libx11-6 libx11-xcb1 libxcb1 fonts-liberation

      - name: Export PDFs (headless Chromium print)
        run: npm run export-pdfs

      - name: Commit generated PDFs
        run: |
          git config user.name "forage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articles frameworks courses
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-generate PDFs [skip ci]"
            git push
          else
            echo "No PDF changes to commit."
          fi

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp -r index.html assets articles frameworks courses templates _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
