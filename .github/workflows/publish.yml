name: Publish Forage Library

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.pdf'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Generate vault manifest
        run: npm run generate-manifest

      - name: Generate Research catalog
        run: npm run generate-catalog

      - name: Generate service worker precache list
        run: npm run generate-precache

      - name: Commit generated files
        run: |
          git config user.name "forage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vault/manifest.json vault/Research/catalog.json sw.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate vault manifest + sw precache list [skip ci]"
            git push
          else
            echo "No generated-file changes to commit."
          fi

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp -r index.html sw.js assets vault _site/

      - name: Stamp service worker cache name with this deploy's commit
        # Gives sw.js a byte-level diff on every deploy — without this,
        # browsers have no signal to re-check a visitor's already-
        # installed service worker for updates, so anyone who'd opted
        # into offline mode would stay pinned to whatever was cached the
        # day they clicked it, forever. See sw.js's own comments for the
        # rest of the update story (network-first navigations).
        run: sed -i "s/__DEPLOY_ID__/${GITHUB_SHA::12}/" _site/sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
