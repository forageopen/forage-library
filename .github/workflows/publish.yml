name: Publish Forage Library

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.pdf'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Generate vault manifest
        run: npm run generate-manifest

      - name: Commit generated manifest
        run: |
          git config user.name "forage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vault/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate vault manifest [skip ci]"
            git push
          else
            echo "No manifest changes to commit."
          fi

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp -r index.html sw.js assets vault _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
